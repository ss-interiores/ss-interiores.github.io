<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisão das imagens · SS Interiores</title>
  <style>
    :root{color-scheme:light dark;--bg:light-dark(#f5f4f0,#171817);--panel:light-dark(#fff,#222421);--fg:light-dark(#242920,#e9ede6);--muted:light-dark(#626b5d,#b2bcac);--line:light-dark(#d7dcd2,#444b40);--active:light-dark(#354b2a,#b7d5a7);--on:light-dark(#fff,#192613);--stage:#141714;font:16px/1.45 system-ui,sans-serif}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg)}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:var(--panel);color:var(--fg);cursor:pointer}button:hover{border-color:var(--active)}button:focus-visible,a:focus-visible{outline:3px solid var(--active);outline-offset:3px}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true],.primary{background:var(--active);color:var(--on);border-color:var(--active)}a{color:inherit}h1,h2,p{margin:0}h1{font-size:24px}h2{font-size:18px}.muted{color:var(--muted);font-size:14px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:0}.page{padding:24px;max-width:1700px;margin:auto;display:grid;gap:20px}.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}.tile{padding:0;text-align:left;overflow:hidden;background:var(--panel)}.tile img{display:block;width:100%;height:170px;object-fit:contain;background:var(--stage)}.tile-info{padding:12px;display:grid;gap:3px}.tile-title{font-weight:600}.group{display:grid;gap:12px}.groups{display:grid;gap:28px}.status{min-height:1.5em}.batch{padding-top:14px;border-top:1px solid var(--line)}
    dialog{border:0;padding:0;color:var(--fg);background:var(--panel);max-width:none;max-height:none;width:96vw;height:96dvh;border-radius:12px;overflow:hidden}dialog::backdrop{background:#000b}dialog:fullscreen{width:100vw;height:100dvh;border-radius:0}.review{height:100%;display:flex;flex-direction:column;min-height:0}.viewer-head{padding:12px 16px;display:grid;gap:8px}.viewer-title{overflow-wrap:anywhere}.toolbar{padding:0 16px 10px}.stage{position:relative;flex:1;min-height:150px;overflow:hidden;background:var(--stage);touch-action:none;cursor:zoom-in}.stage.zoomed{cursor:grab}.stage.dragging{cursor:grabbing}.image-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.photo{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none;transform-origin:center;pointer-events:none}.divider{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}.split-control{width:160px;accent-color:var(--active)}.stage-loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#141714;pointer-events:none}.stage-loading[hidden]{display:none}.side-label{position:absolute;top:10px;padding:4px 9px;background:#000b;color:#fff;border-radius:4px;font-size:13px;pointer-events:none}.side-left{left:10px}.side-right{right:10px}.viewer-foot{padding:10px 16px 14px;display:grid;gap:9px;border-top:1px solid var(--line)}.feedback{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.feedback label{font-size:14px}.feedback input{min-width:100px;flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}.details{max-height:130px;overflow:auto;font-size:14px}.details summary{cursor:pointer}.details p{margin-top:8px}.zoom-label{font-variant-numeric:tabular-nums;min-width:44px;text-align:center}.error{color:light-dark(#9e2525,#ffadad)}
    body:has(dialog[open]){overflow:hidden}
    @media(max-width:600px){.page{padding:14px}.viewer-head{padding:9px}.toolbar{padding:0 9px 8px;gap:6px}.viewer-foot{padding:9px}.viewer-foot .grow{flex-basis:100%}.viewer-head h2{font-size:16px}dialog{width:100%;height:100dvh;border-radius:0}.split-control{width:110px}.viewer-head button,.toolbar button,.viewer-foot button{padding:8px 10px;min-height:42px}.optional{display:none}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile img{height:140px}.tile-info{padding:9px}.tile-title{font-size:14px}.tile .muted{font-size:12px}.feedback input{width:100%}}
  </style>
</head>
<body>
<main class="page">
  <header class="bar"><div class="grow"><h1>Revisão das imagens</h1><p class="muted">Clique em uma imagem para comparar os arquivos originais e decidir.</p></div><button class="primary" data-submit disabled>Enviar lote</button></header>
  <div class="bar"><div class="row" aria-label="Organização"><button data-order="project" aria-pressed="true">Por projeto</button><button data-order="score" aria-pressed="false">Por nota</button></div><p class="grow muted" data-counts></p></div>
  <div class="groups" data-groups></div>
  <footer class="batch"><p class="status muted" data-message role="status" aria-live="polite">Carregando imagens…</p></footer>
</main>
<dialog aria-labelledby="viewer-title" data-dialog>
  <div class="review">
    <header class="viewer-head"><div class="row"><div class="grow viewer-title"><h2 id="viewer-title" data-title></h2><p class="muted" data-identity></p></div><button data-prev aria-label="Imagem anterior">←</button><button data-next aria-label="Próxima imagem">→</button><button data-close>Fechar</button></div></header>
    <div class="toolbar row">
      <div class="row" aria-label="Imagem exibida"><button data-mode="before" aria-pressed="false">Antes</button><button data-mode="split" aria-pressed="true">Comparar</button><button data-mode="after" aria-pressed="false">Depois</button></div>
      <label class="row" data-split-label><span class="muted">Divisão</span><input class="split-control" data-split type="range" min="0" max="100" value="50" aria-label="Divisão entre antes e depois"></label>
      <div class="row"><button data-minus aria-label="Diminuir zoom">−</button><span class="zoom-label" data-zoom>100%</span><button data-plus aria-label="Aumentar zoom">+</button><button data-fit>Ajustar</button></div>
      <button data-fullscreen class="optional">Tela cheia</button>
    </div>
    <div class="stage" data-stage aria-label="Comparação ampliada; clique para ampliar, arraste para mover e use a roda para zoom">
      <div class="image-layer"><img class="photo" data-before alt="Original" draggable="false"></div>
      <div class="image-layer" data-after-layer><img class="photo" data-after alt="Candidata" draggable="false"></div>
      <div class="divider" data-divider></div><span class="side-label side-left" data-left-label>Antes</span><span class="side-label side-right" data-right-label>Depois</span>
      <div class="stage-loading" data-loading>Carregando arquivos originais…</div>
    </div>
    <footer class="viewer-foot">
      <div class="row"><div class="row grow" aria-label="Decisão"><button data-decision="approve" aria-pressed="false">Aprovar nova</button><button data-decision="redo" aria-pressed="false">Refazer</button><button data-decision="pending" aria-pressed="true">Decidir depois</button></div><a data-open-before target="_blank" rel="noopener">Original ↗</a><a data-open-after target="_blank" rel="noopener">Candidata ↗</a></div>
      <div class="feedback"><label for="review-feedback">Comentário</label><input id="review-feedback" data-feedback maxlength="120" placeholder="O que deve ser preservado ou corrigido?"></div>
      <details class="details"><summary>Notas e avaliação técnica</summary><p data-critique></p><p data-qa></p></details>
    </footer>
  </div>
</dialog>
<script>
(()=>{
  const $=selector=>document.querySelector(selector), $$=selector=>Array.from(document.querySelectorAll(selector));
  let images=[],choices={},selectedId='IMG-24',order='project',mode='split',zoom=1,pan={x:0,y:0},split=50,loadSequence=0,saveSequence=Promise.resolve(),saveTimer,drag=null,busy=false,submitted='';
  const dialog=$('[data-dialog]'),stage=$('[data-stage]'),before=$('[data-before]'),after=$('[data-after]');
  const message=(text,error=false)=>{$('[data-message]').textContent=text;$('[data-message]').classList.toggle('error',error);};
  const decisionName=value=>({approve:'Aprovação selecionada',redo:'Refazer selecionado',pending:'Pendente'}[value]);
  const current=()=>images.find(item=>item.id===selectedId);
  const snapshot=()=>({schemaVersion:1,selectedId,decisions:images.map(item=>choices[item.id])});
  const batch=()=>({schemaVersion:1,decisions:images.map(item=>choices[item.id]).filter(item=>item.decision!=='pending')});
  const signature=()=>JSON.stringify(batch());
  async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Falha ao salvar');return data;}
  function persist(){const state=snapshot();saveSequence=saveSequence.catch(()=>{}).then(()=>api('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}));saveSequence.then(()=>message('Escolhas salvas. Somente Enviar lote encaminha suas decisões.'),error=>message('Não foi possível salvar: '+error.message,true));return saveSequence;}
  function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,350);}
  function counts(){const decisions=Object.values(choices);const approved=decisions.filter(item=>item.decision==='approve').length,redo=decisions.filter(item=>item.decision==='redo').length;$('[data-counts]').textContent=`${approved} aprovadas · ${redo} para refazer · ${images.length-approved-redo} pendentes`;$('[data-submit]').disabled=busy||!approved&&!redo||submitted===signature();}
  function gallery(){
    const groups=new Map();
    for(const item of images){const key=order==='project'?item.project:`${item.score}/5 · candidatas`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}
    const entries=[...groups];if(order==='score')entries.sort((a,b)=>Number(b[0][0])-Number(a[0][0]));
    const host=$('[data-groups]');host.replaceChildren();
    for(const [name,items] of entries){const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=name;const grid=document.createElement('div');grid.className='gallery';
      for(const item of items){const button=document.createElement('button');button.className='tile';button.dataset.id=item.id;button.setAttribute('aria-label',`${item.project}, vista ${item.view}, abrir comparação, ${decisionName(choices[item.id].decision)}`);const img=document.createElement('img');img.src=item.after;img.alt='';img.loading='lazy';const info=document.createElement('span');info.className='tile-info';const label=document.createElement('span');label.className='tile-title';label.textContent=`Vista ${item.view} · ${item.id}`;const score=document.createElement('span');score.className='muted';score.textContent=`${item.originalScore}/5 → ${item.score}/5 · v${item.version}`;const status=document.createElement('span');status.className='muted';status.textContent=decisionName(choices[item.id].decision);info.append(label,score,status);button.append(img,info);button.addEventListener('click',()=>open(item.id));grid.append(button);}
      section.append(title,grid);host.append(section);
    }counts();
  }
  function paint(){
    const transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;before.style.transform=after.style.transform=transform;
    $('[data-after-layer]').style.clipPath=mode==='before'?'inset(0 100% 0 0)':mode==='after'?'none':`inset(0 0 0 ${split}%)`;
    $('[data-divider]').hidden=mode!=='split';$('[data-divider]').style.left=split+'%';$('[data-split-label]').hidden=mode!=='split';
    $('[data-left-label]').hidden=mode==='after';$('[data-right-label]').hidden=mode==='before';
    $('[data-zoom]').textContent=Math.round(zoom*100)+'%';stage.classList.toggle('zoomed',zoom>1);
    $$('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
    $('[data-minus]').disabled=zoom<=1;$('[data-plus]').disabled=zoom>=6;
  }
  function setZoom(value,x=stage.clientWidth/2,y=stage.clientHeight/2){const next=Math.max(1,Math.min(6,value));const ratio=next/zoom;pan.x=(pan.x-(x-stage.clientWidth/2))*ratio+(x-stage.clientWidth/2);pan.y=(pan.y-(y-stage.clientHeight/2))*ratio+(y-stage.clientHeight/2);zoom=next;if(zoom===1)pan={x:0,y:0};paint();}
  function fit(){zoom=1;pan={x:0,y:0};paint();}
  function decisionControls(){const choice=choices[selectedId];$$('[data-decision]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.decision===choice.decision)));$('[data-feedback]').value=choice.feedback;counts();}
  async function open(id){
    selectedId=id;const item=current();const sequence=++loadSequence;
    $('[data-title]').textContent=`${item.project} · vista ${item.view}`;$('[data-identity]').textContent=`${item.id} · candidata v${item.version} · ${item.originalScore}/5 → ${item.score}/5`;
    $('[data-critique]').textContent='Original: '+item.critique;$('[data-qa]').textContent='Candidata: '+(item.afterCritique??item.qaNotes);
    $('[data-open-before]').href=item.before;$('[data-open-after]').href=item.after;
    before.alt=`${item.project}, vista ${item.view}, original`;after.alt=`${item.project}, vista ${item.view}, candidata versão ${item.version}`;
    $('[data-loading]').hidden=false;before.src=item.before;after.src=item.after;fit();decisionControls();
    if(!dialog.open)dialog.showModal();
    try{await Promise.all([before.decode(),after.decode()]);if(sequence===loadSequence){$('[data-loading]').hidden=true;stage.dataset.loaded=id;}}
    catch{if(sequence===loadSequence)$('[data-loading]').textContent='Falha ao carregar esta imagem. Feche e tente novamente.';}
    queueSave();
  }
  function navigate(step){const index=images.findIndex(item=>item.id===selectedId);open(images[(index+step+images.length)%images.length].id);}
  $$('[data-order]').forEach(button=>button.addEventListener('click',()=>{order=button.dataset.order;$$('[data-order]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));gallery();}));
  $$('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;paint();}));
  $('[data-split]').addEventListener('input',event=>{split=Number(event.target.value);paint();});
  $('[data-plus]').onclick=()=>setZoom(zoom*1.5);$('[data-minus]').onclick=()=>setZoom(zoom/1.5);$('[data-fit]').onclick=fit;
  $('[data-prev]').onclick=()=>navigate(-1);$('[data-next]').onclick=()=>navigate(1);$('[data-close]').onclick=()=>dialog.close();
  $('[data-fullscreen]').hidden=!document.fullscreenEnabled;$('[data-fullscreen]').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await dialog.requestFullscreen();}catch{}};
  dialog.addEventListener('close',()=>{gallery();queueSave();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});});
  dialog.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','BUTTON','A'].includes(event.target.tagName))return;if(event.key==='ArrowLeft')navigate(-1);if(event.key==='ArrowRight')navigate(1);});
  stage.addEventListener('wheel',event=>{event.preventDefault();const rect=stage.getBoundingClientRect();setZoom(zoom*Math.exp(-event.deltaY*.0015),event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
  stage.addEventListener('pointerdown',event=>{if(event.button!==0)return;stage.setPointerCapture(event.pointerId);drag={id:event.pointerId,x:event.clientX,y:event.clientY,pan:{...pan},moved:false};});
  stage.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(zoom>1){pan={x:drag.pan.x+dx,y:drag.pan.y+dy};stage.classList.add('dragging');paint();}});
  const release=event=>{if(!drag||event.pointerId!==drag.id)return;const clicked=!drag.moved;drag=null;stage.classList.remove('dragging');if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);if(clicked&&event.type==='pointerup'){const rect=stage.getBoundingClientRect();setZoom(zoom===1?2:1,event.clientX-rect.left,event.clientY-rect.top);}};
  stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
  $$('[data-decision]').forEach(button=>button.onclick=()=>{choices[selectedId].decision=button.dataset.decision;submitted='';decisionControls();queueSave();});
  $('[data-feedback]').oninput=event=>{choices[selectedId].feedback=event.target.value.slice(0,120);submitted='';counts();queueSave();};
  $('[data-submit]').onclick=async()=>{busy=true;counts();try{clearTimeout(saveTimer);await persist();const receipt=await api('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(batch())});submitted=signature();message(`Lote ${receipt.id} registrado (${receipt.count} decisões). Volte à conversa e clique em “Processar lote enviado”.`);}catch(error){message(error.message,true);}finally{busy=false;counts();}};
  Promise.all([api('/api/catalog'),api('/api/state')]).then(([catalog,saved])=>{images=catalog.images;const restored=new Map((saved.decisions??[]).filter(item=>item&&typeof item==='object').map(item=>[item.id,item]));for(const item of images){const choice=restored.get(item.id);choices[item.id]={id:item.id,version:item.version,hash:item.hash,decision:choice?.version===item.version&&choice.hash===item.hash&&['approve','redo','pending'].includes(choice.decision)?choice.decision:'pending',feedback:choice?.version===item.version&&choice.hash===item.hash&&typeof choice.feedback==='string'?choice.feedback.slice(0,120):''};}if(images.some(item=>item.id===saved.selectedId))selectedId=saved.selectedId;gallery();message('Arquivos na resolução original. Clique para comparar; use a roda ou + para ampliar.');}).catch(error=>message(error.message,true));
})();
</script>
</body>
</html>
